<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ElevenLabs Poređenje Glasova</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --bg:#0a0a0c;
    --bg2:#121212;
    --card:#1a1a1a;
    --card-hi:#202020;
    --border:#2a2a2a;
    --border-hi:#3a3a3a;
    --accent:#ff8c00;
    --accent-soft:rgba(255,140,0,.16);
    --accent-glow:rgba(255,140,0,.55);
    --text:#ffffff;
    --text-soft:#a39b8f;
    --text-dim:#6b6560;
    --good:#3ddc84;
    --font:'Inter',-apple-system,'Segoe UI',ui-sans-serif,system-ui,sans-serif;
    --mono:'SF Mono','Menlo',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- ambient background ---------- */
  #bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.28;mix-blend-mode:screen}
  .orb1{width:480px;height:480px;background:radial-gradient(circle,#ff8c00,transparent 70%);top:-160px;left:-120px;animation:drift1 26s ease-in-out infinite}
  .orb2{width:560px;height:560px;background:radial-gradient(circle,#ffb347,transparent 70%);bottom:-220px;right:-160px;animation:drift2 32s ease-in-out infinite}
  .orb3{width:360px;height:360px;background:radial-gradient(circle,#ff4d4d,transparent 70%);top:40%;left:60%;animation:drift3 22s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,60px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-50px)}}
  @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(-100px,40px)}}
  .grid-overlay{position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,140,0,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,140,0,.05) 1px,transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(ellipse 90% 70% at 50% 20%,#000 40%,transparent 90%);
  }

  /* ---------- layout ---------- */
  #app{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:28px 32px 80px}

  header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:22px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
  .brand-row1{display:flex;align-items:center;gap:10px}
  .brand img{height:34px;filter:drop-shadow(0 0 14px var(--accent-glow))}
  .brand-title{font-size:22px;font-weight:800;letter-spacing:.3px;line-height:1;color:var(--text)}
  .brand h1{font-size:15px;font-weight:600;letter-spacing:.2px;color:var(--text-soft)}
  .brand .sub{font-size:12px;color:var(--text-dim);font-family:var(--mono);letter-spacing:.5px;text-transform:uppercase}
  .stats-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .stats-row span{display:inline-flex;align-items:center;gap:5px}
  .stats-row .icon-sm{color:var(--accent);opacity:.85}

  .model-toggle{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px;gap:2px;position:relative}
  .model-toggle button{
    position:relative;z-index:2;border:none;background:transparent;color:var(--text-soft);
    font-family:var(--font);font-weight:600;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;
    transition:color .25s;white-space:nowrap;
  }
  .model-toggle button.active{color:#111}
  .model-toggle .thumb{
    position:absolute;top:4px;bottom:4px;left:4px;
    background:linear-gradient(135deg,#ffb347,var(--accent));
    border-radius:999px;box-shadow:0 0 22px var(--accent-glow),0 2px 8px rgba(0,0,0,.4);
    transition:transform .35s cubic-bezier(.65,0,.35,1),width .35s cubic-bezier(.65,0,.35,1);
    z-index:1;
  }
  .model-badge{font-family:var(--mono);font-size:10px;opacity:.75;margin-left:6px}

  .view-tabs{display:flex;gap:8px;margin-bottom:20px}
  .view-tabs button{
    background:var(--card);border:1px solid var(--border);color:var(--text-soft);
    font-family:var(--font);font-weight:600;font-size:13px;padding:9px 16px;border-radius:10px;cursor:pointer;
    transition:all .2s;
  }
  .view-tabs button.active{color:var(--text);border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 16px rgba(255,140,0,.15)}
  .view-tabs button:hover:not(.active){border-color:var(--border-hi);color:var(--text)}

  /* ---------- voices view ---------- */
  #view-voices{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start;min-width:0}
  #view-voices[hidden],#view-leaderboard[hidden]{display:none}
  @media (max-width:980px){#view-voices{grid-template-columns:1fr}}

  .panel{
    background:linear-gradient(180deg,rgba(26,26,26,.85),rgba(18,18,18,.85));
    backdrop-filter:blur(14px);
    border:1px solid var(--border);border-radius:16px;padding:16px;
    min-width:0;
  }

  .search{
    width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;
    color:var(--text);font-family:var(--font);font-size:13px;padding:10px 12px;outline:none;
    display:block;
  }
  .search:focus{border-color:var(--accent)}
  .sort-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .sort-row button{
    flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--text-dim);
    font-size:11px;font-family:var(--mono);padding:6px 8px;border-radius:8px;cursor:pointer;white-space:nowrap;
  }
  .sort-row button.active{color:var(--accent);border-color:var(--accent)}

  .voice-list{max-height:74vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
  .voice-list::-webkit-scrollbar{width:6px}
  .voice-list::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:3px}

  .voice-card{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
    border:1px solid transparent;background:var(--bg2);cursor:pointer;transition:all .18s;
  }
  .voice-card:hover{background:var(--card-hi);border-color:var(--border-hi)}
  .voice-card.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 18px rgba(255,140,0,.12)}
  .avatar{
    width:36px;height:36px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#111;
    background:linear-gradient(135deg,#ffb347,var(--accent));
  }
  .avatar.f{background:linear-gradient(135deg,#ff9ecf,#ff5da2)}
  .vc-info{min-width:0;flex:1}
  .vc-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vc-tag{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vc-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .badge{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:5px;border:1px solid var(--border-hi);color:var(--text-dim);white-space:nowrap}
  .badge.price3{color:#ff6b6b;border-color:#5a2a2a}
  .score-pill{font-family:var(--mono);font-size:10px;color:var(--good);display:inline-flex;align-items:center;gap:3px}
  .score-pill .icon-sm{color:var(--good)}

  /* ---------- player ---------- */
  .player-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .player-voice{display:flex;align-items:center;gap:14px}
  .player-voice .avatar{width:52px;height:52px;font-size:18px}
  .player-voice h2{font-size:20px;font-weight:700}
  .player-voice .vc-tag{font-size:13px}
  .usage-row{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}
  .usage-row span{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;color:var(--text-dim)}
  .usage-row .icon-sm{color:var(--text-dim)}

  .cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .cat-tab{
    background:var(--bg2);border:1px solid var(--border);color:var(--text-soft);
    font-size:12px;font-weight:600;padding:8px 13px;border-radius:9px;cursor:pointer;transition:all .18s;
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  }
  .cat-tab small{font-family:var(--mono);font-weight:400;color:var(--text-dim);font-size:10px}
  .cat-tab.active{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}

  .version-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .version-row .lbl{font-size:11px;color:var(--text-dim);font-family:var(--mono);text-transform:uppercase}
  .ver-pill{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);
    color:var(--text-soft);font-family:var(--mono);font-size:12px;cursor:pointer;transition:all .18s;
  }
  .ver-pill.active{border-color:var(--accent);color:#111;background:var(--accent);box-shadow:0 0 14px var(--accent-glow)}

  .sentence-box{
    background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:15px;line-height:1.5;color:#eee;
  }

  .transport{
    background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;
    display:flex;align-items:center;gap:16px;margin-bottom:14px;
  }
  .play-btn{
    width:52px;height:52px;border-radius:50%;border:none;flex:none;cursor:pointer;
    background:linear-gradient(135deg,#ffb347,var(--accent));color:#111;font-size:18px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px var(--accent-glow);
    transition:transform .15s;
  }
  .play-btn:active{transform:scale(.92)}
  #wave{flex:1;height:52px;border-radius:8px;min-width:0;width:100%}
  .time{font-family:var(--mono);font-size:11px;color:var(--text-dim);flex:none;min-width:80px;text-align:right}

  .rating-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .rating-row .stars{margin-left:auto}
  .stars{display:flex;gap:4px}
  .star{cursor:pointer;color:#3a3a3a;transition:color .12s,transform .12s;display:inline-flex}
  .star svg{width:40px;height:40px}
  .star.filled{color:var(--accent);filter:drop-shadow(0 0 6px var(--accent-glow))}
  .star:hover{transform:scale(1.15)}
  .rating-label{font-size:11px;color:var(--text-dim);font-family:var(--mono)}

  .ghost-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-soft);
    font-size:11px;font-family:var(--mono);padding:7px 12px;border-radius:8px;cursor:pointer;transition:all .18s;
  }
  .ghost-btn:hover{border-color:var(--accent);color:var(--accent)}
  .ghost-btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  /* ---------- leaderboard ---------- */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;color:var(--text-dim);font-family:var(--mono);text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
  th:hover{color:var(--accent)}
  td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px}
  tbody tr{cursor:pointer;transition:background .15s}
  tbody tr:hover{background:var(--bg2)}
  .rank{font-family:var(--mono);color:var(--text-dim);width:34px}
  .rank.top1{color:#ffd700}
  .rank.top2{color:#c0c0c0}
  .rank.top3{color:#cd7f32}
  .lb-name{display:flex;align-items:center;gap:10px}
  .lb-score{font-family:var(--mono);color:var(--text);font-weight:700}
  .lb-stars{display:flex;gap:2px}
  .lb-stars .icon{width:15px;height:15px}
  .lb-stars .full,.lb-stars .half{color:var(--accent);filter:drop-shadow(0 0 4px var(--accent-glow))}
  .lb-stars .empty{color:#3a3a3a}

  .leaderboard-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .leaderboard-header h2{font-size:16px}

  a{color:inherit}
  .icon{width:16px;height:16px;display:inline-block;vertical-align:-3px;flex:none}
  .icon-sm{width:13px;height:13px;vertical-align:-2px}
  .icon-lg{width:22px;height:22px;vertical-align:-5px}
  .view-tabs button{display:inline-flex;align-items:center;gap:7px}
  .model-toggle button{display:inline-flex;align-items:center;gap:6px}
  .search-wrap{position:relative;margin-bottom:12px}
  .search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-dim)}
  .search-wrap input{padding-left:34px}
  .play-btn svg{width:20px;height:20px}
  .mini-play svg{width:14px;height:14px}
  .leaderboard-header h2{display:flex;align-items:center;gap:8px}

  /* ---------- mobile ---------- */
  @media (max-width:640px){
    #app{padding:18px 14px 60px}
    .brand-title{font-size:19px}
    .brand h1{font-size:13px}
    .brand img{height:28px}
    .stats-row{gap:10px;row-gap:5px}
    header{gap:14px;margin-bottom:18px}

    .model-toggle{width:100%;margin-bottom:16px}
    .model-toggle button{flex:1;padding:9px 8px;font-size:12px;justify-content:center}
    .view-tabs{width:100%}
    .view-tabs button{flex:1;justify-content:center;padding:9px 8px}

    /* plejer prvo, lista glasova ispod - toggle modela ide iznad plejera preko JS relokacije */
    #playerPanel{order:-1}

    .panel{padding:12px}
    .voice-list{max-height:56vh}

    .player-head{gap:10px}
    .player-voice{gap:10px}
    .player-voice .avatar{width:44px;height:44px;font-size:15px}
    .player-voice h2{font-size:16px}
    .usage-row{gap:10px}

    .cat-tabs{gap:5px}
    .cat-tab{padding:7px 9px;font-size:11px}
    .cat-tab small{font-size:9px}

    .version-row{flex-wrap:wrap;row-gap:8px}

    .transport{padding:12px;gap:10px}
    .play-btn{width:44px;height:44px}
    .play-btn svg{width:16px;height:16px}
    .time{min-width:64px;font-size:10px}

    .rating-row{justify-content:center;text-align:center}
    .rating-row .stars{margin-left:0;width:100%;justify-content:center}
    .star svg{width:30px;height:30px}

    table{font-size:12px}
    th,td{padding:8px 6px;white-space:nowrap}
    .lb-stars .icon{width:12px;height:12px}
  }
</style>
</head>
<body>

<div id="bgfx">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="grid-overlay"></div>
</div>

<div id="app">
  <header>
    <div class="brand">
      <div class="brand-row1">
        <img src="logo.png" alt="AI Zdravo">
        <span class="brand-title">AI ZDRAVO</span>
      </div>
      <h1>ElevenLabs Poređenje Glasova</h1>
      <div class="sub stats-row">
        <span><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12.9a5 5 0 1 0 -3.902 -3.9"/><path d="M15 12.9l-3.902 -3.899l-7.513 8.584a2 2 0 1 0 2.827 2.83l8.588 -7.515"/></svg>41 glas</span>
        <span><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11h-4a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1h3a1 1 0 0 1 1 1v6c0 2.667 -1.333 4.333 -4 5"/><path d="M19 11h-4a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1h3a1 1 0 0 1 1 1v6c0 2.667 -1.333 4.333 -4 5"/></svg>5 rečenica</span>
        <span><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 7a2 2 0 0 1 2 -2h6a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2l0 -10"/><path d="M7 7l0 10"/><path d="M4 8l0 8"/></svg>3 verzije</span>
        <span><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-12a1 1 0 0 1 -1 -1l0 -12"/><path d="M9 9h6v6h-6l0 -6"/><path d="M3 10h2"/><path d="M3 14h2"/><path d="M10 3v2"/><path d="M14 3v2"/><path d="M21 10h-2"/><path d="M21 14h-2"/><path d="M14 21v-2"/><path d="M10 21v-2"/></svg>2 modela</span>
      </div>
    </div>
    <div class="model-toggle" id="modelToggle">
      <div class="thumb" id="modelThumb"></div>
      <button data-model="multi" id="btnMulti">Multilingual v2</button>
      <button data-model="flash" id="btnFlash">Flash v2.5 <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11"/></svg></button>
    </div>
  </header>

  <div class="view-tabs">
    <button class="active" data-view="voices" id="tabVoices"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5a3 3 0 0 1 3 -3a3 3 0 0 1 3 3v5a3 3 0 0 1 -3 3a3 3 0 0 1 -3 -3l0 -5"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M8 21l8 0"/><path d="M12 17l0 4"/></svg>Glasovi</button>
    <button data-view="leaderboard" id="tabLeaderboard"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21l8 0"/><path d="M12 17l0 4"/><path d="M7 4l10 0"/><path d="M17 4v8a5 5 0 0 1 -10 0v-8"/><path d="M3 9a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 9a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/></svg>Rang lista</button>
  </div>

  <div id="modelToggleMobileSlot"></div>

  <section id="view-voices">
    <div class="panel" id="voiceListPanel">
      <div class="search-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg>
        <input class="search" id="search" placeholder="Traži glas...">
      </div>
      <div class="sort-row" id="sortRow">
        <button data-sort="name" class="active">A-Ž</button>
        <button data-sort="score">Ocjena</button>
        <button data-sort="usage">Popularnost</button>
      </div>
      <div class="voice-list" id="voiceList"></div>
    </div>

    <div class="panel" id="playerPanel"></div>
  </section>

  <section id="view-leaderboard" hidden>
    <div class="panel">
      <div class="leaderboard-header">
        <h2><svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21l8 0"/><path d="M12 17l0 4"/><path d="M7 4l10 0"/><path d="M17 4v8a5 5 0 0 1 -10 0v-8"/><path d="M3 9a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 9a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/></svg>Rang lista glasova</h2>
        <button class="ghost-btn" id="resetRatings">Resetuj sve ocjene</button>
      </div>
      <div style="overflow-x:auto">
        <table id="lbTable">
          <thead>
            <tr>
              <th data-k="rank">#</th>
              <th data-k="name">Glas</th>
              <th data-k="score">Ukupna ocjena</th>
              <th data-k="multi">Multilingual v2</th>
              <th data-k="flash">Flash v2.5</th>
              <th data-k="count">Broj ocjena</th>
            </tr>
          </thead>
          <tbody id="lbBody"></tbody>
        </table>
      </div>
    </div>
  </section>

</div>

<audio id="player" preload="auto"></audio>

          <div class="rating-label">${stats.count} ocjena ukupno</div>
        </div>
      </div>

      <div class="cat-tabs" id="catTabs">${catTabs}</div>
      <div class="version-row">
        <span class="lbl">Verzija</span>
        <div id="verPills" style="display:flex;gap:8px">${verPills}</div>
      </div>

      <div class="sentence-box">${cat.text}</div>

      <div class="transport">
        <button class="play-btn" id="playBtn">${ICONS.play}</button>
        <canvas id="wave" width="600" height="52"></canvas>
        <div class="time" id="timeLabel">0:00 / 0:00</div>
      </div>

      <div class="rating-row">
        <span class="rating-label">Kako ti se čini ovaj glas na modelu ${state.model==='multi'?'Multilingual v2':'Flash v2.5'}?</span>
        ${starsHTML(state.model, true)}
      </div>
    `;

    // wire cat tabs
    document.querySelectorAll('.cat-tab').forEach(el=>{
      el.addEventListener('click', ()=>{ state.cat = el.dataset.cat; loadAndMaybePlay(); renderPlayer(); });
    });
    document.querySelectorAll('.ver-pill').forEach(el=>{
      el.addEventListener('click', ()=>{ state.ver = el.dataset.ver; loadAndMaybePlay(); renderPlayer(); });
    });
    document.getElementById('playBtn').addEventListener('click', togglePlay);

    document.querySelectorAll('.rating-row .star').forEach(el=>{
      el.addEventListener('click', ()=>{
        const k = ratingKey(el.dataset.model, v.id);
        const val = parseInt(el.dataset.val,10);
        ratings[k] = (ratings[k]===val) ? 0 : val; // click same star again to clear
        saveRatings(ratings);
        renderPlayer();
        renderVoiceList();
      });
    });
    loadClip(false);
    startWaveLoop(true);
  }

  // ---------- audio + waveform ----------
  // #player je JEDINI element koji pusta zvuk - obican <audio>, garantovano pouzdano.
  // Waveform NIJE live Web Audio analiza (MediaElementAudioSourceNode na cross-origin
  // Blob audiju se pokazao nepouzdan - povremeno vraca nulte podatke bez ikakvog
  // upozorenja, provjereno da CORS headeri stoje ispravno na svakoj ruti pa je uzrok
  // browser-specifican kvirk van naseg dosega). Umjesto toga: fajl se unaprijed
  // preuzme i dekodira preko decodeAudioData u niz stvarnih amplituda (jednom po
  // klipu, keširano), pa se tokom sviranja crta prozor tog PRAVOG talasa koji klizi
  // u sinhronizaciji sa audioEl.currentTime - stvarna audio-reaktivna animacija,
  // bez oslanjanja na live analyser koji zna da puca.
  const audioEl = document.getElementById('player');
  let rafId = null;
  const WAVE_BUCKETS = 200;
  const waveformCache = new Map(); // url -> Promise<Float32Array|null>
  let decodeCtx = null;
  let currentWaveform = null;
  let waveformToken = 0;

  function getDecodeCtx(){
    if(!decodeCtx){
      try{ decodeCtx = new (window.AudioContext||window.webkitAudioContext)(); }
      catch(e){ decodeCtx = null; }
    }
    return decodeCtx;
  }

  function getWaveform(url){
    if(waveformCache.has(url)) return waveformCache.get(url);
    const p = (async()=>{
      const ctx = getDecodeCtx();
      if(!ctx) return null;
      const res = await fetch(url);
      const buf = await res.arrayBuffer();
      const audioBuf = await ctx.decodeAudioData(buf);
      const data = audioBuf.getChannelData(0);
      const bucketSize = Math.max(1, Math.ceil(data.length / WAVE_BUCKETS));
      // RMS (prosjecna energija) po bucketu, ne apsolutni pik - jedan glasan
      // trenutak (npr. plozivni suglasnik) inace zgnjeci vizuelni prikaz
      // ostatka govora u skoro-tisinu.
      const rms = new Float32Array(WAVE_BUCKETS);
      for(let i=0;i<WAVE_BUCKETS;i++){
        let sumSq = 0;
        const start = i*bucketSize, end = Math.min(data.length, start+bucketSize);
        for(let j=start;j<end;j++){ const v = data[j]; sumSq += v*v; }
        rms[i] = Math.sqrt(sumSq / Math.max(1, end-start));
      }
      // Normalizuj po 90. percentilu umjesto apsolutnom maksimumu - isti razlog,
      // plus blagi boost (^0.6) tisih dijelova da prikaz izgleda zivlje.
      const sorted = Array.from(rms).sort((a,b)=>a-b);
      const ref = sorted[Math.floor(sorted.length*0.9)] || sorted[sorted.length-1] || 1;
      const peaks = new Float32Array(WAVE_BUCKETS);
      for(let i=0;i<WAVE_BUCKETS;i++){
        const norm = ref > 0 ? Math.min(1, rms[i]/ref) : 0;
        peaks[i] = Math.pow(norm, 0.6);
      }
      return peaks;
    })().catch(e=>{
      console.warn('Waveform dekodiranje nije uspjelo, koristi se fallback animacija', e);
      return null;
    });
    waveformCache.set(url, p);
    return p;
  }

  function loadClip(autoPlay){
    const path = clipPath(state.model, state.voiceId, state.cat, state.ver);
    const url = encodePath(path);
    audioEl.src = url;
    updateTimeLabel();
    currentWaveform = null;
    const myToken = ++waveformToken;
    getWaveform(url).then(w=>{ if(myToken === waveformToken) currentWaveform = w; });
    if(autoPlay){ audioEl.play().catch(()=>{}); }
  }
  function loadAndMaybePlay(){
    const wasPlaying = !audioEl.paused;
    loadClip(wasPlaying);
  }

  function togglePlay(){
    if(audioEl.paused){ audioEl.play().catch(e=>console.warn(e)); }
    else{ audioEl.pause(); }
  }

  audioEl.addEventListener('play', ()=>{
    const btn = document.getElementById('playBtn');
    if(btn) btn.innerHTML = ICONS.pause;
    startWaveLoop();
  });
  audioEl.addEventListener('pause', ()=>{
    const btn = document.getElementById('playBtn');
    if(btn) btn.innerHTML = ICONS.play;
    startWaveLoop(); // ostaje da radi dok se stubovi ne smire na sredisnjoj liniji
  });
  audioEl.addEventListener('timeupdate', updateTimeLabel);

  function fmtTime(t){
    if(!isFinite(t)) return '0:00';
    const m = Math.floor(t/60), s = Math.floor(t%60);
    return m+':'+String(s).padStart(2,'0');
  }
  function updateTimeLabel(){
    const lbl = document.getElementById('timeLabel');
    if(!lbl) return;
    lbl.textContent = fmtTime(audioEl.currentTime)+' / '+fmtTime(audioEl.duration||0);
  }


  // Stabilan per-stub "karakter" (0..1) - da ne skacu svi identicno kao jedan
  // blok, nego da svaki stub ima svoju blago drugaciju osjetljivost, kao kod
  // pravog ekvilajzera sa vise frekvencijskih traka.
  const BAR_CHAR = Array.from({length:40}, (_,i)=>{
    const x = Math.sin(i*12.9898 + 4.1) * 43758.5453;
    return 0.55 + 0.45*(x - Math.floor(x));
  });

  // Stubovi su CENTRIRANI na sredisnjoj liniji (rastu i gore i dole od nje),
  // ne odozdo naviše - tako "mirno" stanje (nivo 0) PRIRODNO izgleda kao ta
  // ista tanka linija na sredini, ne kao odvojen crtez. smoothLevel se svaki
  // frejm eksponencijalno priblizava targetu (stvaran audio nivo dok svira,
  // 0 dok je pauzirano) - nema naglog "sjeckanja", samo glatko rastapanje
  // gore-dole i nazad na liniju.
  let smoothLevel = 0;
  let waveLoopRunning = false;

  function currentTargetLevel(){
    if(audioEl.paused) return 0;
    const dur = audioEl.duration || 0;
    const progress = dur > 0 ? Math.min(1, audioEl.currentTime/dur) : 0;
    if(currentWaveform && currentWaveform.length){
      const idx = Math.min(currentWaveform.length-1, Math.max(0, Math.round(progress*currentWaveform.length)));
      const span = 2;
      let sum = 0, cnt = 0;
      for(let k=-span;k<=span;k++){
        const j = idx+k;
        if(j>=0 && j<currentWaveform.length){ sum += currentWaveform[j]; cnt++; }
      }
      return cnt ? sum/cnt : currentWaveform[idx];
    }
    return 0.35; // fallback dok se waveform jos preuzima/dekodira
  }

  function startWaveLoop(force){
    // force=true kad renderPlayer() zamijeni DOM (nov, prazan <canvas>) - stari
    // rAF ciklus i dalje drzi referencu na STARI (uklonjeni) canvas, pa treba
    // otkazati i ponovo uhvatiti trenutni element, inace novi canvas ostaje prazan.
    if(waveLoopRunning && !force) return;
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    waveLoopRunning = true;
    const canvas = document.getElementById('wave');
    if(!canvas){ waveLoopRunning = false; return; }
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height, mid = h/2;
    const bars = 40;

    function frame(){
      const target = currentTargetLevel();
      smoothLevel += (target - smoothLevel) * 0.15;
      const settled = target===0 && smoothLevel < 0.01;
      if(settled) smoothLevel = 0;

      ctx.clearRect(0,0,w,h);
      const idleAlpha = 0.35 + 0.65*Math.min(1, smoothLevel/0.4);
      for(let i=0;i<bars;i++){
        const jitter = (Math.sin(Date.now()/90 + i*1.7) + 1)/2;
        const v = smoothLevel * BAR_CHAR[i] * (0.7 + 0.3*jitter);
        const bh = Math.max(2, v*h);
        const x = i*(w/bars);
        const y = mid - bh/2;
        const grad = ctx.createLinearGradient(0,y,0,y+bh);
        grad.addColorStop(0,'#ffb347');
        grad.addColorStop(1,'#ff8c00');
        ctx.globalAlpha = idleAlpha;
        ctx.fillStyle = grad;
        ctx.fillRect(x, y, (w/bars)-2, bh);
      }
      ctx.globalAlpha = 1;

      if(settled){ waveLoopRunning = false; return; }
      rafId = requestAnimationFrame(frame);
    }
    frame();
  }

  // ---------- model toggle ----------
  function renderModelToggle(){
    const isFlash = state.model==='flash';
    document.getElementById('btnMulti').classList.toggle('active', !isFlash);
    document.getElementById('btnFlash').classList.toggle('active', isFlash);
    const thumb = document.getElementById('modelThumb');
    const target = isFlash ? document.getElementById('btnFlash') : document.getElementById('btnMulti');
    const toggle = document.getElementById('modelToggle');
    requestAnimationFrame(()=>{
      const tRect = target.getBoundingClientRect();
      const pRect = toggle.getBoundingClientRect();
      thumb.style.width = tRect.width+'px';
      thumb.style.transform = 'translateX('+(tRect.left-pRect.left-4)+'px)';
      thumb.style.height = (tRect.height)+'px';
    });
  }
  document.getElementById('btnMulti').addEventListener('click', ()=>{ state.model='multi'; renderAll(); loadClip(false); });
  document.getElementById('btnFlash').addEventListener('click', ()=>{ state.model='flash'; renderAll(); loadClip(false); });

  // ---------- leaderboard ----------
  let lbSort = { key:'score', dir:-1 };
  function renderLeaderboard(){
    const rows = VOICES.map(v=>({v, stats: voiceStats(v)}));
    rows.sort((a,b)=>{
      function val(row, key){
        if(key==='name') return row.v.name;
        if(key==='score') return row.stats.avg===null?-1:row.stats.avg;
        if(key==='multi') return row.stats.avgMulti===null?-1:row.stats.avgMulti;
        if(key==='flash') return row.stats.avgFlash===null?-1:row.stats.avgFlash;
        if(key==='count') return row.stats.count;
      }
      const av = val(a, lbSort.key), bv = val(b, lbSort.key);
      if(typeof av === 'string') return av.localeCompare(bv) * lbSort.dir;
      return (av-bv) * lbSort.dir;
    });
    const body = document.getElementById('lbBody');
    body.innerHTML = rows.map((row,i)=>{
      const rankClass = i===0?'top1':i===1?'top2':i===2?'top3':'';
      const s = row.stats;
      return `<tr data-id="${row.v.id}">
        <td class="rank ${rankClass}">${i+1}</td>
        <td>
          <div class="lb-name">
            <div class="avatar ${row.v.gender==='Ž'?'f':''}" style="width:28px;height:28px;font-size:11px">${initials(row.v.name)}</div>
            <div>
              <div style="font-weight:600">${row.v.name} ${row.v.price==='3x'?'<span class="badge price3">3x</span>':''}</div>
              <div style="font-size:11px;color:var(--text-dim)">${row.v.tag}</div>
            </div>
          </div>
        </td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="lb-score">${s.avg!==null?s.avg.toFixed(2):'—'}</span>
            ${renderStarRow(s.avg)}
          </div>
        </td>
        <td style="font-family:var(--mono);color:var(--text-soft)">${s.avgMulti!==null?s.avgMulti.toFixed(2):'—'}</td>
        <td style="font-family:var(--mono);color:var(--text-soft)">${s.avgFlash!==null?s.avgFlash.toFixed(2):'—'}</td>
        <td style="font-family:var(--mono);color:var(--text-dim)">${s.count}</td>
      </tr>`;
    }).join('');
    body.querySelectorAll('tr').forEach(tr=>{
      tr.addEventListener('click', ()=>{
        state.voiceId = tr.dataset.id;
        state.view = 'voices';
        renderAll();
        switchView('voices');
      });
    });
  }
  document.querySelectorAll('#lbTable th').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.dataset.k;
      if(k==='rank') return;
      if(lbSort.key===k) lbSort.dir *= -1; else { lbSort.key=k; lbSort.dir = (k==='name')?1:-1; }
      renderLeaderboard();
    });
  });
  document.getElementById('resetRatings').addEventListener('click', ()=>{
    if(confirm('Sigurno obrisati SVE ocjene? Ovo se ne može poništiti.')){
      ratings = {};
      saveRatings(ratings);
      renderAll();
    }
  });

  // ---------- view switch ----------
  function switchView(view){
    state.view = view;
    document.getElementById('view-voices').hidden = view!=='voices';
    document.getElementById('view-leaderboard').hidden = view!=='leaderboard';
    document.getElementById('tabVoices').classList.toggle('active', view==='voices');
    document.getElementById('tabLeaderboard').classList.toggle('active', view==='leaderboard');
    if(view==='leaderboard') renderLeaderboard();
  }
  document.getElementById('tabVoices').addEventListener('click', ()=>switchView('voices'));
  document.getElementById('tabLeaderboard').addEventListener('click', ()=>switchView('leaderboard'));

  // ---------- search / sort ----------
  document.getElementById('search').addEventListener('input', (e)=>{ state.query = e.target.value; renderVoiceList(); });
  document.querySelectorAll('#sortRow button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#sortRow button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.sort = btn.dataset.sort;
      renderVoiceList();
    });
  });

  function renderAll(){
    renderModelToggle();
    renderVoiceList();
    renderPlayer();
  }

  renderAll();
  startWaveLoop();
  window.addEventListener('resize', renderModelToggle);

  // Na mobilnom: model-toggle se fizicki premjesta iznad plejera (izmedju
  // tabova i #view-voices) umjesto da ostane u zaglavlju - drugi kontekst
  // na razlicitim breakpointima, pa cist CSS "order" nije dovoljan jer
  // toggle i plejer nisu u istom kontejneru.
  (function(){
    const toggle = document.getElementById('modelToggle');
    const desktopSlot = document.querySelector('header');
    const mobileSlot = document.getElementById('modelToggleMobileSlot');
    const mq = window.matchMedia('(max-width:640px)');
    function place(){
      if(mq.matches){ mobileSlot.appendChild(toggle); }
      else{ desktopSlot.appendChild(toggle); }
      renderModelToggle();
    }
    place();
    mq.addEventListener('change', place);
  })();
})();
</script>
</body>
</html>
